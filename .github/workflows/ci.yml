name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ats, POSTGRES_PASSWORD: ats, POSTGRES_DB: ats_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U ats" --health-interval 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - name: Start S3 storage
        run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.50 server -s3 -dir=/data -ip.bind=0.0.0.0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
        env:
          S3_ENDPOINT: http://localhost:8333
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
